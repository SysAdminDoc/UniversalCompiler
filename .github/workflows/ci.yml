name: Universal Compiler contract gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: universal-compiler-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Select Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Install contract tools
        shell: pwsh
        run: python -m pip install --disable-pip-version-check pytest==8.3.5 ruff==0.9.10 mypy==1.15.0

      - name: Run isolated contract tests
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP ("universal-compiler-tests-" + $env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $base) { throw "Unexpected existing test root: $base" }
          $env:PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1"
          python -m pytest -q --basetemp $base
          $code = $LASTEXITCODE
          if (Test-Path -LiteralPath $base) { Remove-Item -LiteralPath $base -Recurse -Force -ErrorAction SilentlyContinue }
          if (Test-Path -LiteralPath $base) { $code = 1; Write-Error "Test root was not cleaned: $base" }
          exit $code

      - name: Lint
        shell: pwsh
        run: ruff check .

      - name: Type check
        shell: pwsh
        run: mypy compiler_core.py UniversalCompiler.py
